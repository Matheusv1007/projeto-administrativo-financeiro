<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Extração de Nota Fiscal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main class="container">

        <header class="cabecalho-aplicacao">

            <div>
                <p class="identificacao">&Aacute;rea autenticada</p>
            </div>

            <form
                class="form-logout"
                method="post"
                action="{{ url_for('logout') }}"
            >
                <button class="botao-secundario" type="submit">
                    Sair
                </button>
            </form>

        </header>

        <h1>Extração de Dados de Nota Fiscal</h1>

        <p>
            Carregue uma nota fiscal em PDF
            para extrair seus dados utilizando IA.
        </p>

        <section class="card">

            <form id="formNota">

                <div class="campo">
                    <label for="apiKey">
                        Chave da API Gemini
                    </label>

                    <input
                        type="password"
                        id="apiKey"
                        name="api_key"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="Cole sua chave aqui"
                        required
                    >

                    <small>
                        A chave &eacute; usada somente nesta
                        requisi&ccedil;&atilde;o e n&atilde;o &eacute; armazenada.
                    </small>

                    <div class="acoes-chave">
                        <button
                            id="botaoConfirmarChave"
                            type="button"
                        >
                            Confirmar chave
                        </button>

                        <button
                            id="botaoAlterarChave"
                            class="botao-secundario"
                            type="button"
                            hidden
                        >
                            Alterar chave
                        </button>
                    </div>

                    <p
                        id="statusChave"
                        class="status-chave"
                        aria-live="polite"
                    >
                        Nenhuma chave configurada.
                    </p>
                </div>

                <label for="arquivo">
                    Selecione a Nota Fiscal
                </label>

                <input
                    type="file"
                    id="arquivo"
                    name="arquivo"
                    accept="application/pdf"
                    required
                    disabled
                >

                <button
                    id="botaoExtrair"
                    type="submit"
                    disabled
                >
                    Extrair Dados
                </button>

            </form>

        </section>

        <section
            id="resultadoContainer"
            class="card resultado"
        >

            <h2>Dados Extraídos</h2>

            <p id="status">
                Nenhuma nota processada.
            </p>

            <pre id="resultado"></pre>

        </section>

    </main>

    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>

</body>

</html>
