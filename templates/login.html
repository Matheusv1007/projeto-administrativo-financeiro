<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Projeto Administrativo-Financeiro</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="pagina-login">

    <main class="login-container">

        <section class="card shadow-sm">
            <div class="card-body p-4">

                <p class="text-uppercase text-body-secondary small fw-bold mb-1">
                    Acesso restrito
                </p>

                <h1 class="h3">Projeto Administrativo-Financeiro</h1>

                <p class="text-body-secondary">
                    Entre com as credenciais fornecidas para acessar
                    a aplica&ccedil;&atilde;o.
                </p>

                {% if erro %}
                    <div class="alert alert-danger" role="alert">
                        {{ erro }}
                    </div>
                {% endif %}

                <form method="post" action="{{ url_for('login') }}">

                    <div class="mb-3">
                        <label class="form-label" for="usuario">Usu&aacute;rio</label>

                        <input
                            class="form-control"
                            type="text"
                            id="usuario"
                            name="usuario"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="senha">Senha</label>

                        <input
                            class="form-control"
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button class="btn btn-primary w-100" type="submit">Entrar</button>

                </form>

            </div>
        </section>

    </main>

</body>

</html>
